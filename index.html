<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f4f3ef" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Nupcial. La coordinación de tu boda, siempre a mano y sin conexión."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Nupcial · Tu boda, en orden</title>
    <link rel="icon" href="./public/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./public/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">Ir al contenido</a>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <a class="brand-mark" href="#home" aria-label="Inicio"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.8 4.8c-2.2-2.3-5.8-1.5-8.8 1.2C9 3.3 5.4 2.5 3.2 4.8-.5 8.7 4.9 15.3 12 20c7.1-4.7 12.5-11.3 8.8-15.2Z"
              /></svg
          ></a>
          <div class="brand-copy">
            <a class="wordmark" href="#home" aria-label="Nupcial, inicio"
              >nup<span>cial</span><i></i></a
            ><span class="brand-date" id="header-date">21 NOV 2026</span>
          </div>
        </div>
        <div class="header-right">
          <span class="connection sr-only" id="connection"
            >En este dispositivo</span
          ><button
            class="icon-button"
            id="theme"
            aria-label="Cambiar a modo oscuro"
          ></button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <p class="loading">Abriendo tu evento…</p>
      </main>
      <nav class="bottom-nav" aria-label="Navegación principal" id="nav"></nav>
      <footer class="desktop-foot">
        Nupcial · Versión de prueba · Datos en este dispositivo
      </footer>
    </div>
    <dialog id="dialog" aria-label="Editar datos">
      <div class="dialog-top">
        <div class="handle" aria-hidden="true"></div>
        <button
          class="icon-button close-dialog"
          aria-label="Cerrar ventana"
          type="button"
        ></button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <div class="preview-tag">Versión de prueba</div>
  </body>
</html>
